<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matices de Carácter Musical</title>
    <!-- Fuente Serif para simular notación musical -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* ===== RESET Y BASE ===== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
            line-height: 1.5;
        }

        /* ===== LAYOUT ===== */
        .h-screen { height: 100vh; }
        .h-full { height: 100%; }
        .w-full { width: 100%; }
        .max-w-md { max-width: 28rem; }
        
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .items-end { align-items: flex-end; }
        .justify-center { justify-content: center; }
        
        .gap-1 { gap: 0.25rem; }
        .gap-6 { gap: 1.5rem; }

        .shrink-0 { flex-shrink: 0; }

        /* ===== SPACING ===== */
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .p-2 { padding: 0.5rem; }
        
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-8 { margin-top: 2rem; }
        .mx-4 { margin-left: 1rem; margin-right: 1rem; }

        /* ===== SIZING ===== */
        .h-2 { height: 0.5rem; }
        .h-10 { height: 2.5rem; }
        .h-12 { height: 3rem; }
        .h-32 { height: 8rem; }
        .h-64 { height: 16rem; }
        .w-2 { width: 0.5rem; }
        .w-0\.5 { width: 0.125rem; }
        .w-48 { width: 12rem; }
        .h-48 { height: 12rem; }

        /* ===== POSITIONING ===== */
        .relative { position: relative; }
        .absolute { position: absolute; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
        .top-0 { top: 0; }
        .left-4 { left: 1rem; }
        .right-4 { right: 1rem; }
        .top-1\/2 { top: 50%; }
        .left-1\/2 { left: 50%; }
        
        .z-0 { z-index: 0; }
        .z-10 { z-index: 10; }
        .z-20 { z-index: 20; }
        .-z-10 { z-index: -10; }

        .overflow-hidden { overflow: hidden; }

        /* ===== TRANSFORMS ===== */
        .transform { transform: translate(var(--tw-translate-x, 0), var(--tw-translate-y, 0)) rotate(var(--tw-rotate, 0)) scale(var(--tw-scale-x, 1), var(--tw-scale-y, 1)); }
        .-translate-x-1\/2 { transform: translateX(-50%); }
        .-translate-y-1\/2 { transform: translateY(-50%); }
        .translate-center { transform: translate(-50%, -50%); }
        .origin-center { transform-origin: center; }
        .scale-125 { transform: scale(1.25); }

        /* ===== TYPOGRAPHY ===== */
        .text-center { text-align: center; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-8xl { font-size: 6rem; line-height: 1; }
        
        .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace; }
        .font-light { font-weight: 300; }
        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        
        .uppercase { text-transform: uppercase; }
        .tracking-wide { letter-spacing: 0.025em; }
        .tracking-widest { letter-spacing: 0.1em; }

        .select-none { user-select: none; }

        /* ===== COLORS ===== */
        .text-white { color: #ffffff; }
        .text-white\/50 { color: rgba(255, 255, 255, 0.5); }
        .text-white\/80 { color: rgba(255, 255, 255, 0.8); }
        .text-white\/90 { color: rgba(255, 255, 255, 0.9); }
        
        .bg-white { background-color: #ffffff; }
        .bg-white\/10 { background-color: rgba(255, 255, 255, 0.1); }
        .bg-white\/30 { background-color: rgba(255, 255, 255, 0.3); }
        .bg-white\/50 { background-color: rgba(255, 255, 255, 0.5); }

        /* Colores dinámicos */
        .bg-indigo-900 { background-color: #312e81; }
        .bg-blue-700 { background-color: #1d4ed8; }
        .bg-cyan-600 { background-color: #0891b2; }
        .bg-teal-500 { background-color: #14b8a6; }
        .bg-yellow-500 { background-color: #eab308; }
        .bg-orange-500 { background-color: #f97316; }
        .bg-red-600 { background-color: #dc2626; }
        .bg-rose-900 { background-color: #881337; }

        /* ===== BORDERS ===== */
        .rounded-full { border-radius: 9999px; }

        /* ===== EFFECTS ===== */
        .drop-shadow-lg { filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.04)) drop-shadow(0 4px 3px rgba(0, 0, 0, 0.1)); }
        .blur-xl { filter: blur(24px); }
        .opacity-80 { opacity: 0.8; }

        /* ===== TRANSITIONS ===== */
        .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        .transition-colors { transition-property: color, background-color, border-color; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        .transition-opacity { transition-property: opacity; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        .transition-transform { transition-property: transform; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        .duration-200 { transition-duration: 200ms; }
        .duration-300 { transition-duration: 300ms; }
        .duration-500 { transition-duration: 500ms; }
        .ease-out { transition-timing-function: cubic-bezier(0, 0, 0.2, 1); }

        .pointer-events-none { pointer-events: none; }

        /* ===== DISPLAY ===== */
        .block { display: block; }

        /* ===== RESPONSIVE MD (768px+) ===== */
        @media (min-width: 768px) {
            .md\:max-w-2xl { max-width: 42rem; }
            .md\:text-base { font-size: 1rem; line-height: 1.5rem; }
            .md\:text-sm { font-size: 0.875rem; line-height: 1.25rem; }
            .md\:text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
            .md\:text-9xl { font-size: 8rem; line-height: 1; }
            .md\:mb-8 { margin-bottom: 2rem; }
            .md\:mb-10 { margin-bottom: 2.5rem; }
            .md\:mb-12 { margin-bottom: 3rem; }
            .md\:h-40 { height: 10rem; }
            .md\:h-72 { height: 18rem; }
            .md\:w-64 { width: 16rem; }
            .md\:h-64 { height: 16rem; }
            .md\:px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        }

        /* ===== CUSTOM STYLES ===== */
        
        /* Estilos personalizados para el slider (range input) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            position: relative;
            z-index: 20;
            height: 32px;
            margin: 0;
            cursor: pointer;
        }

        /* Thumb (La bola) */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 32px;
            width: 32px;
            border-radius: 50%;
            background: #ffffff;
            margin-top: -12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid currentColor;
            transition: transform 0.1s, background-color 0.2s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        /* Firefox */
        input[type=range]::-moz-range-thumb {
            height: 32px;
            width: 32px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 2px solid currentColor;
            transition: transform 0.1s, background-color 0.2s;
            cursor: pointer;
        }

        input[type=range]::-moz-range-thumb:hover {
            transform: scale(1.1);
        }

        /* Track (El riel) */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        input[type=range]::-moz-range-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Notación musical */
        .musical-text {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 700;
            line-height: 1;
        }

        /* Estilo para las etiquetas clicables */
        .tick-label {
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            user-select: none;
        }
        .tick-label:hover {
            color: white;
            font-weight: bold;
        }

        /* Posición específica del tick superior */
        .top-12px { top: 12px; }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-center overflow-hidden relative">

    <!-- Fondo dinámico -->
    <div id="app-bg" class="absolute inset-0 -z-10 transition-colors duration-500 ease-out"></div>

    <!-- Contenedor Principal -->
    <main class="w-full max-w-md px-6 py-8 md:max-w-2xl text-center relative z-10 flex flex-col h-full justify-center">
        
        <h1 class="text-white/90 text-sm md:text-base font-semibold tracking-widest uppercase mb-4 md:mb-8">Dinámica Musical</h1>

        <!-- Visualizador Central -->
        <div class="mb-6 md:mb-10 relative h-64 md:h-72 flex flex-col items-center justify-center shrink-0 gap-6">
            
            <!-- Círculo de fondo -->
            <div id="visual-circle" class="absolute top-1/2 left-1/2 translate-center w-48 h-48 md:w-64 md:h-64 rounded-full bg-white/10 blur-xl transition-all duration-500 pointer-events-none"></div>
            
            <!-- Contenedor del Símbolo para centrado y escala -->
            <div class="relative flex items-center justify-center h-32 md:h-40 w-full">
                <!-- Símbolo Musical -->
                <div id="dynamic-symbol" class="musical-text text-8xl md:text-9xl text-white drop-shadow-lg transition-transform duration-300 transform select-none origin-center">
                    mp
                </div>
            </div>
            
            <!-- Contenedor de Textos (Separado del símbolo para evitar superposición) -->
            <div class="flex flex-col items-center z-10">
                <!-- Nombre -->
                <div id="dynamic-name" class="text-2xl md:text-3xl font-bold text-white tracking-wide transition-opacity duration-300">
                    Mezzo-piano
                </div>

                <!-- Descripción -->
                <div id="dynamic-desc" class="mt-2 text-white/80 text-lg font-light">
                    Moderadamente suave
                </div>
            </div>
        </div>

        <!-- Barras de Volumen -->
        <div class="flex justify-center items-end gap-1 h-12 mb-8 md:mb-12 w-full px-10 opacity-80 shrink-0">
            <div class="bar w-2 bg-white rounded-full transition-all duration-300" style="height: 10%"></div>
            <div class="bar w-2 bg-white rounded-full transition-all duration-300" style="height: 20%"></div>
            <div class="bar w-2 bg-white rounded-full transition-all duration-300" style="height: 35%"></div>
            <div class="bar w-2 bg-white rounded-full transition-all duration-300" style="height: 50%"></div>
            <div class="bar w-2 bg-white rounded-full transition-all duration-300" style="height: 65%"></div>
            <div class="bar w-2 bg-white rounded-full transition-all duration-300" style="height: 80%"></div>
            <div class="bar w-2 bg-white rounded-full transition-all duration-300" style="height: 90%"></div>
            <div class="bar w-2 bg-white rounded-full transition-all duration-300" style="height: 100%"></div>
        </div>

        <!-- Área del Slider -->
        <div class="w-full relative px-4 md:px-6">
            
            <div class="relative w-full">
                
                <!-- CONTENEDOR DE MUESCAS (Ticks) -->
                <div id="ticks-container" class="absolute top-12px left-4 right-4 h-2 pointer-events-none z-0">
                    <!-- JS generará las líneas aquí -->
                </div>

                <!-- Input Range Principal -->
                <input type="range" id="dynamic-slider" min="0" max="7" value="3" step="1" aria-label="Control de dinámica musical" class="block w-full">
                
                <!-- CONTENEDOR DE ETIQUETAS -->
                <div id="labels-container" class="relative mx-4 h-10 mt-2 select-none">
                    <!-- JS generará las etiquetas aquí -->
                </div>
            </div>

        </div>
        
        <p class="text-white/50 text-xs md:text-sm mt-8">Desliza o pulsa en las letras para cambiar</p>

    </main>

    <script>
        const dynamics = [
            { symbol: "ppp", name: "Pianississimo", desc: "Extremadamente suave", color: "bg-indigo-900", hex: "#312e81", intensity: 10 },
            { symbol: "pp", name: "Pianissimo", desc: "Muy suave", color: "bg-blue-700", hex: "#1d4ed8", intensity: 20 },
            { symbol: "p", name: "Piano", desc: "Suave", color: "bg-cyan-600", hex: "#0891b2", intensity: 35 },
            { symbol: "mp", name: "Mezzo-piano", desc: "Moderadamente suave", color: "bg-teal-500", hex: "#14b8a6", intensity: 50 },
            { symbol: "mf", name: "Mezzo-forte", desc: "Moderadamente fuerte", color: "bg-yellow-500", hex: "#eab308", intensity: 65 },
            { symbol: "f", name: "Forte", desc: "Fuerte", color: "bg-orange-500", hex: "#f97316", intensity: 80 },
            { symbol: "ff", name: "Fortissimo", desc: "Muy fuerte", color: "bg-red-600", hex: "#dc2626", intensity: 90 },
            { symbol: "fff", name: "Fortississimo", desc: "Extrema fuerza", color: "bg-rose-900", hex: "#881337", intensity: 100 }
        ];

        const slider = document.getElementById('dynamic-slider');
        const symbolDisplay = document.getElementById('dynamic-symbol');
        const nameDisplay = document.getElementById('dynamic-name');
        const descDisplay = document.getElementById('dynamic-desc');
        const appBg = document.getElementById('app-bg');
        const visualCircle = document.getElementById('visual-circle');
        const bars = document.querySelectorAll('.bar');
        const ticksContainer = document.getElementById('ticks-container');
        const labelsContainer = document.getElementById('labels-container');

        function initSliderMarks() {
            ticksContainer.innerHTML = '';
            labelsContainer.innerHTML = '';
            
            const count = dynamics.length;

            dynamics.forEach((dyn, index) => {
                const percent = (index / (count - 1)) * 100;

                // 1. Muesca (Tick)
                const tick = document.createElement('div');
                tick.className = 'absolute top-0 w-0.5 h-2 bg-white/50 rounded-full';
                tick.style.left = `${percent}%`;
                tick.style.transform = 'translateX(-50%)';
                ticksContainer.appendChild(tick);

                // 2. Etiqueta (Label)
                const label = document.createElement('div');
                label.className = 'tick-label absolute top-0 text-white/50 text-xs md:text-sm font-mono p-2';
                label.style.left = `${percent}%`;
                label.style.transform = 'translateX(-50%)';
                label.textContent = dyn.symbol;
                
                label.onclick = () => {
                    slider.value = index;
                    updateUI(index);
                };
                
                labelsContainer.appendChild(label);
            });
        }

        function updateUI(index) {
            const data = dynamics[index];

            symbolDisplay.textContent = data.symbol;
            nameDisplay.textContent = data.name;
            descDisplay.textContent = data.desc;

            appBg.className = `absolute inset-0 -z-10 transition-colors duration-500 ease-out ${data.color}`;
            slider.style.color = data.hex;

            // Etiquetas
            const allLabels = labelsContainer.querySelectorAll('.tick-label');
            allLabels.forEach((lbl, i) => {
                lbl.className = 'tick-label absolute top-0 text-xs md:text-sm font-mono p-2 transition-all duration-200';
                lbl.style.left = `${(i / (dynamics.length - 1)) * 100}%`;
                lbl.style.transform = 'translateX(-50%)';

                if(i === index) {
                    lbl.classList.add('text-white', 'font-bold', 'scale-125');
                } else {
                    lbl.classList.add('text-white/50');
                }
            });

            // Escala del símbolo
            let scale = 0.9 + (index * 0.05); 
            symbolDisplay.style.transform = `scale(${scale})`;

            // Fondo visual
            let circleSize = 10 + (index * 5);
            visualCircle.style.width = `${circleSize}rem`;
            visualCircle.style.height = `${circleSize}rem`;
            visualCircle.style.opacity = 0.1 + (index * 0.05);

            // Barras tipo ecualizador
            bars.forEach((bar, i) => {
                const threshold = (i + 1) * (100 / bars.length);
                if (data.intensity >= threshold - 10) {
                    bar.style.height = `${Math.min(100, 20 + Math.random() * 80)}%`;
                    bar.style.opacity = '1';
                } else {
                    bar.style.height = '10%';
                    bar.style.opacity = '0.3';
                }
            });
        }

        slider.addEventListener('input', (e) => {
            updateUI(parseInt(e.target.value));
        });

        initSliderMarks();
        updateUI(parseInt(slider.value));
    </script>
</body>
</html>
